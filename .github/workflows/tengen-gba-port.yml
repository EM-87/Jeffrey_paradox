# Tengen Tetris -> GBA port: the checks that need no cartridge dump.
#
# The ROM itself, and the 42 checks `make gba-check` runs against it, need the
# graphics and the sound engine that `make assets` extracts from a dump of the
# original cartridge — which is not in this repository and must not be. So
# what runs here is everything that does not: the rules core and its tests
# (with the sanitizers too), the asset converter's own self-test, the core
# cross-compiled for the GBA, and the host side of the cartridge trace.
# `make gba-check` and the probes against the cartridge stay local.
name: tengen-gba-port

on:
  push:
    paths:
      - "tengen_gba_port/**"
      - ".github/workflows/tengen-gba-port.yml"
  pull_request:
    paths:
      - "tengen_gba_port/**"
      - ".github/workflows/tengen-gba-port.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: tengen_gba_port

jobs:
  core:
    name: Core rules (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # -Werror: the build is warning-free today and should stay that way.
      - name: make test
        run: make test CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -Werror -g -O1"

      # The same tests under AddressSanitizer and UBSan. A rule that works on
      # x86 and not on the GBA's ARM is most likely undefined behaviour, and
      # this is where it shows.
      - name: make test (sanitizers)
        run: |
          make clean
          make test CFLAGS="-std=c99 -Wall -Wextra -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all"

      # The host half of `make trace` (the port against the cartridge, frame
      # by frame). The comparison needs a dump; building it does not.
      - name: trace harness builds
        run: make build/trace_core CFLAGS="-std=c99 -Wall -Wextra -Werror -O1"

  core-arm:
    name: Core cross-compiles for the GBA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install arm-none-eabi-gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      # The platform-independent core with the ROM's own flags (see ARMFLAGS
      # in the Makefile). The gba/ layer cannot be built here: it includes
      # the headers `make assets` generates from a dump.
      - name: Compile src/ for ARM7TDMI, Thumb
        run: |
          for f in src/tengen_core.c src/tengen_link.c src/tengen_ai.c; do
            arm-none-eabi-gcc -mcpu=arm7tdmi -mthumb -mthumb-interwork \
              -std=c99 -Wall -Wextra -Werror -O2 -ffreestanding -fno-builtin \
              -c "$f" -o /dev/null
          done

  tools:
    name: Asset converter and tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Tile conversion, attributes, screen reflow and title composition,
      # checked on synthetic data — no dump needed.
      - name: make assets-check
        run: make assets-check
      - name: Python tools compile
        run: python -m py_compile tools/*.py tools/probes/*.py
